name: Publish Yap Home container

on:
  push:
    tags:
      - 'home-v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/yaplgbt/yappers-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the release image
        run: |
          set -eu
          version="${GITHUB_REF_NAME#home-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source_dir="$(mktemp -d)"
          sh deploy/peering/package-source.sh "$source_dir"
          revision="$(cat "$source_dir/revision.txt")"
          source_archive="$source_dir/$revision.tar.gz"
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$revision.tar.gz"
          docker build -f deploy/compose/Dockerfile \
            --build-arg "YAP_BUILD_SOURCE_SHA256=$revision" \
            --label "org.yap.home.source-archive=$source_url" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$IMAGE:$version" .
          printf 'HOME_IMAGE=%s:%s\nSOURCE_ARCHIVE=%s\n' "$IMAGE" "$version" "$source_archive" >> "$GITHUB_ENV"
      - name: Check the packaged server and admin
        run: |
          docker run --rm --network none "$HOME_IMAGE" sh -ec '
            test -s /usr/local/share/yap/admin/index.html
            test -w /var/lib/yap-reports
            yappers-server covenant-show >/dev/null
          '
      - name: Publish the corresponding source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          asset="${SOURCE_ARCHIVE##*/}"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "$assets" | rg -Fxq "$asset"; then
            gh release upload "$GITHUB_REF_NAME" "$SOURCE_ARCHIVE"
          fi
      - name: Push the release image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$HOME_IMAGE"
