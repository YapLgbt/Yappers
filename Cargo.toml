[workspace]
members = ["netkit", "backend"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# iOS compatibility: match the libc/mio pair in the published Iroh 1.5.0 lockfile.
libc = "=0.2.189"
mio = "=1.2.3"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
blake3 = "1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "debuginfo"
lto = "thin"
