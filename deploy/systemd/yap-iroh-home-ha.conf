[Service]
Environment=YAP_PEERING_POLICY=/etc/yap/peering.json
Environment=YAP_SOURCE_BASE_URL=https://yap.lgbt/source
ExecStartPre=
ExecStartPre=/usr/bin/test -s /var/lib/yap-iroh-replica/v5/public-home.json
ExecStartPre=/usr/bin/test -s /var/lib/yap-iroh-replica/v5/fly-ha-grant.json
ExecStart=
ExecStart=/usr/local/lib/yap-iroh-replica/yappers-server-v5 ha-run --config /var/lib/yap-iroh-replica/v5/public-home.json --grant /var/lib/yap-iroh-replica/v5/fly-ha-grant.json
